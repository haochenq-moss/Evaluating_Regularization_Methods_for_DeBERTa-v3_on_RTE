dataset_config: rte
premise_column: sentence1
hypothesis_column: sentence2
max_len: 64
train_fraction: 0.70
validation_fraction: 0.15
test_fraction: 0.15
dev_eval_size: 64
train_size: 64
test_size: 64
epochs: 1
batch_size: 16
eval_batch_size: 32
