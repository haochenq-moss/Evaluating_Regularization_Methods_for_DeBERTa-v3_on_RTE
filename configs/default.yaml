# RTE protocol: stratified 70:15:15 internal split; official GLUE validation is final test.
model_name: microsoft/deberta-v3-base
dataset_name: nyu-mll/glue
dataset_config: rte
premise_column: sentence1
hypothesis_column: sentence2
max_len: 128
train_fraction: 0.70
validation_fraction: 0.15
test_fraction: 0.15
split_seed: 13
epochs: 3
batch_size: 32
eval_batch_size: 128
lr: 2.0e-5
weight_decay: 0.01
final_seeds: [42, 123, 456]
ece_bins: 10
augmentation_generator: google/flan-t5-large
augmentation_seed: 2718
augmentation_confidence: 0.85
augmentation_batch_size: 8
augmentation_max_new_tokens: 96
augmentation_file: outputs/augmentation/filtered.jsonl
grid:
  lrs: [1.0e-5, 2.0e-5, 3.0e-5]
  baseline_epochs: [3, 4, 5]
  augmentation: [0.25, 0.50, 1.00]
  label_smoothing: [0.05, 0.10, 0.15]
  mixup: [0.1, 0.2, 0.4]
  rdrop: [0.5, 1.0, 4.0]
  neftune: [5.0, 10.0, 15.0]
